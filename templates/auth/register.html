{% extends "base.html" %}
{% block title %}Register — TrekManager{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2><i class="bi bi-mountain text-primary"></i> TrekManager</h2>
            <p class="auth-subtitle">Create a new account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="Your full name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Create a password" required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Confirm your password" required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">I am a</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="" disabled selected>— Select Role —</option>
                    <option value="trekker">Trekker (User)</option>
                    <option value="staff">Trek Staff</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
        </form>

        <p class="text-center mt-3 mb-0" style="font-size: 0.9rem; color: #64748B;">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
