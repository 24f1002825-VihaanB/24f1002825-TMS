{% extends "base.html" %}
{% block title %}Login — TrekManager{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2><i class="bi bi-mountain text-primary"></i> TrekManager</h2>
            <p class="auth-subtitle">Sign in to your account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
        </form>

        <p class="text-center mt-3 mb-0" style="font-size: 0.9rem; color: #64748B;">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
