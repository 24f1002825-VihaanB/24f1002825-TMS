{% extends "base.html" %}
{% block title %}My Profile — TrekManager{% endblock %}

{% block content %}
{% set active = 'profile' %}
{% include 'partials/user_sidebar.html' %}

<div class="main-content">
    <h4 class="mb-4">My Profile</h4>

    <div class="card" style="max-width: 600px;">
        <div class="card-body">
            <form method="POST" action="{{ url_for('user.profile') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                           value="{{ user.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email"
                           value="{{ user.email }}" disabled>
                    <small class="text-muted">Email cannot be changed.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <div>
                        <span class="badge bg-light text-dark">{{ user.role | title }}</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Member Since</label>
                    <div class="text-muted">{{ user.created_at.strftime('%d %b %Y') }}</div>
                </div>

                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
